# ==============================================================================
# KAMGLOBAL AI - NGINX PRODUCTION CONFIG
# Domain: kamglobalai.com
# Location on VPS: /etc/nginx/sites-available/kamglobalai.conf
#
# Services:
#   - React SPA Frontend (static) → /var/www/kamglobalai-com/frontend/dist
#   - Express Backend API        → 127.0.0.1:5001
# ==============================================================================

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name kamglobalai.com www.kamglobalai.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kamglobalai.com www.kamglobalai.com;

    # SSL Certificate (Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/kamglobalai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kamglobalai.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Static site root (React Vite build output)
    root /var/www/kamglobalai-com/frontend/dist;
    index index.html;

    client_max_body_size 50M;

    # Gzip Compression
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # ─────────────────────────────────────────────────────────────────────────
    # 1. Backend REST API → Port 5001
    # ─────────────────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:5001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 30s;
    }

    # ─────────────────────────────────────────────────────────────────────────
    # 2. Backend-served uploads (resumes, attachments)
    # ─────────────────────────────────────────────────────────────────────────
    location /uploads/ {
        proxy_pass http://127.0.0.1:5001/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # ─────────────────────────────────────────────────────────────────────────
    # 3. React SPA static assets (JS/CSS chunks from Vite build)
    # ─────────────────────────────────────────────────────────────────────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ─────────────────────────────────────────────────────────────────────────
    # 4. React SPA Fallback (all other routes → index.html)
    # ─────────────────────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
